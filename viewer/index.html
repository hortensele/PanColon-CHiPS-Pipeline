<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PanColon-CHiPS · results</title>
<script src="openseadragon/openseadragon.min.js"></script>
<style>
  :root{
    --paper:#fff; --bg:#f7f5fa; --ink:#1e1a26; --muted:#6d6580; --line:#e6e1ee;
    --eosin:#c02f6b; --hema:#4d40a6; --eosin-soft:#fbe9f1; --hema-soft:#ebe8fa;
    --good:#1c7f5a; --warn:#b8860b; --bad:#c0392b;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(30,26,38,.05),0 8px 24px rgba(30,26,38,.06);
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#1f1b2a; --bg:#141019; --ink:#f1edf7; --muted:#a79fb6; --line:#302943;
    --eosin:#f0619b; --hema:#9d8ff4; --eosin-soft:#38202f; --hema-soft:#241f3e;
    --good:#3fbf90; --warn:#e0b040; --bad:#f0685a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  code{font-family:var(--mono)}
  .top{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;padding:1rem clamp(1rem,3vw,2rem);border-bottom:1px solid var(--line);background:var(--paper)}
  .top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.01em}
  .top .eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--eosin)}
  .top .meta{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
  .tabs{display:flex;gap:.4rem;padding:.6rem clamp(1rem,3vw,2rem) 0;background:var(--paper);border-bottom:1px solid var(--line)}
  .tab{font-family:var(--mono);font-size:.78rem;padding:.5rem .9rem;border:1px solid var(--line);border-bottom:0;background:var(--bg);color:var(--muted);border-radius:8px 8px 0 0;cursor:pointer}
  .tab.on{background:var(--paper);color:var(--eosin);border-color:var(--line);font-weight:700}

  .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.2rem;padding:1.2rem clamp(1rem,3vw,2rem)}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}
  .slidelist{display:flex;flex-direction:column;gap:.35rem;max-height:80vh;overflow:auto}
  .slidelist button{text-align:left;font-family:var(--mono);font-size:.78rem;padding:.5rem .6rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
  .slidelist button.on{border-color:var(--eosin);background:var(--eosin-soft)}
  .slidelist .sc{color:var(--muted);font-variant-numeric:tabular-nums}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;box-shadow:var(--shadow)}
  .panel h2{font-size:.74rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
  .empty{color:var(--muted);font-style:italic;font-size:.85rem}

  .kpi{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
  .kpi .c,.chip-readout .c{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem}
  .kpi .n,.chip-readout .n{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
  .kpi .l,.chip-readout .l{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--bg)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .pill{display:inline-block;font-family:var(--mono);font-size:.64rem;padding:.1rem .45rem;border-radius:20px;text-transform:uppercase;letter-spacing:.06em}
  .pill.high{background:var(--eosin-soft);color:var(--eosin)} .pill.low{background:var(--hema-soft);color:var(--hema)}
  .pill.intermediate{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

  .dist-row{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:.5rem;margin-bottom:.28rem;cursor:pointer}
  .dist-label{font-family:var(--mono);font-size:.72rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dist-track{background:var(--bg);border:1px solid var(--line);border-radius:5px;height:14px;overflow:hidden}
  .dist-fill{height:100%;border-radius:4px 5px 5px 4px;background:var(--eosin)}
  .dist-val{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

  .slide-head{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.7rem}
  .slide-head .sid{font-family:var(--mono);font-weight:700;font-size:1rem}
  .chip-readout{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
  .panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin-bottom:1rem}
  @media (max-width:900px){.panels{grid-template-columns:1fr}}
  .panel-cell{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
  .panel-title{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:.4rem .6rem;border-bottom:1px solid var(--line)}
  .osd{width:100%;height:340px;background:#0e0b16}
  .osd-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.8rem}
  .hint{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin:.2rem 0 1rem}

  .hpc-total{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:.5rem}
  .hpc-row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:.5rem;margin-bottom:.28rem;cursor:default}
  .hpc-label{font-family:var(--mono);font-size:.72rem;color:var(--ink)}
  .hpc-track{background:var(--bg);border:1px solid var(--line);border-radius:5px;height:14px;overflow:hidden}
  .hpc-fill{height:100%;border-radius:4px 5px 5px 4px}
  .hpc-val{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .hpc-desc{font-size:.72rem;color:var(--muted);margin:0 0 .55rem 64px;line-height:1.4}
  .hpc-risk-line{margin:0 0 .2rem 64px}
  .risk-note{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-left:.35rem}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2rem}
  @media (max-width:860px){.two{grid-template-columns:1fr}}

  .hpc-tooltip{position:fixed;z-index:1000;display:none;pointer-events:none;
    background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.72rem;
    padding:.3rem .55rem;border-radius:6px;box-shadow:var(--shadow);max-width:260px}
  @media (prefers-color-scheme:dark){.hpc-tooltip{background:var(--paper);color:var(--ink);border:1px solid var(--line)}}

  .osd{position:relative}
  .hpc-highlight{position:absolute;pointer-events:none;display:none;box-sizing:border-box;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 6px rgba(0,0,0,.5);
    border-radius:2px;z-index:5}

  .atlas-list{display:flex;flex-direction:column;gap:.6rem}
  .atlas-row{display:grid;grid-template-columns:14px 56px 1fr;gap:.6rem;align-items:start;padding:.4rem 0;border-bottom:1px solid var(--line)}
  .atlas-swatch{width:14px;height:14px;border-radius:4px;margin-top:.2rem;flex:none}
  .atlas-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
  .atlas-thumb-ph{width:56px;height:56px}
  .atlas-name{font-size:.85rem;margin-bottom:.15rem}
  .atlas-desc{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="eyebrow">PanColon-CHiPS · results</div>
    <h1 id="dataset">cohort</h1>
  </div>
  <div class="meta" id="nslides"></div>
</div>
<div class="tabs">
  <div class="tab on" data-tab="cohort">Cohort</div>
  <div class="tab" data-tab="slide">Slide</div>
  <div class="tab" data-tab="atlas">HPC atlas</div>
</div>
<div class="hpc-tooltip" id="hpcTooltip"></div>

<div id="app">
<div class="wrap">
  <div class="slidelist" id="slideList"></div>

  <div>
    <!-- cohort view -->
    <div id="cohortView">
      <div class="panel" style="margin-bottom:1.2rem">
        <h2>Cohort · CHiPS</h2>
        <div class="kpi" id="kpi"></div>
      </div>
      <div class="two">
        <div class="panel">
          <h2>Score distribution (ranked)</h2>
          <div id="dist"></div>
        </div>
        <div class="panel">
          <h2>Scores</h2>
          <div class="tbl-wrap"><table id="chipsTable"><thead></thead><tbody></tbody></table></div>
        </div>
      </div>
    </div>

    <!-- slide view -->
    <div id="slideView" style="display:none">
      <div class="panel">
        <div class="slide-head" id="slideHead"></div>
        <div class="chip-readout" id="chipReadout"></div>
        <p class="hint">Pan or zoom any panel — all three move together.</p>
        <div class="panels" id="panels"></div>
        <h2>HPC composition</h2>
        <div id="hpcChart"></div>
      </div>
    </div>

    <!-- HPC atlas view -->
    <div id="atlasView" style="display:none">
      <div class="panel">
        <h2>Histological phenotype clusters (HPC)</h2>
        <div class="atlas-list" id="atlasList"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script src="viewer.js"></script>
</body>
</html>
