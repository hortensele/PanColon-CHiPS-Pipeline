# ==========================================================================
# PanColon-CHiPS configuration for the CONTAINER image (Docker / Singularity).
# --------------------------------------------------------------------------
# Paths here are fixed to the image + its bind mounts, so a collaborator never
# edits this file — they just mount three directories and run:
#
#   docker run --gpus all \
#     -v /path/to/slides:/data -v /path/to/weights:/weights -v /path/to/out:/out \
#     pancolon-chips:latest
#
#   singularity run --nv \
#     -B /path/to/slides:/data -B /path/to/weights:/weights -B /path/to/out:/out \
#     pancolon.sif
#
# (`--gpus all` / `--nv` are optional; without a GPU it runs on CPU, slower.)
# ==========================================================================

repo_root: "/opt/pancolon"          # where the repo is copied inside the image
dataset_name: "cohort"              # override with:  … pancolon_pipeline.py … (env COHORT)
magnification: "20x"

paths:
  wsi_dir: "/data"                  # mount your slide folder here
  work_dir: "/out"                  # all intermediate + final outputs land here
  clinical_csv: ""                  # optional; leave blank for pure scoring
  slide_id_col: "slide_id"

# ---- Conda environments built into the image (see docker/Dockerfile) ------
envs:
  conda_sh: "/opt/conda/etc/profile.d/conda.sh"
  tiling: "pancolon_tiling"         # DeepPATH + HPL (TensorFlow) stage, steps 1-5
  survclam: "pancolon_survclam"     # SurvCLAM (PyTorch) stage, steps 6-8
  tiling_module: ""                 # built as a conda env in-image, not a module
  survclam_module: ""
  module_init: ""

# ---- Vendored tool code shipped in the image ------------------------------
tools:
  deeppath_root: "/opt/pancolon/vendor/deeppath"
  hpl_root: "/opt/pancolon/vendor/hpl"
  survclam_root: "/opt/pancolon/vendor/survclam"

# ---- Trained weights + reference clustering (mounted at /weights) ----------
# Downloaded once from Zenodo (scripts/download_weights.sh) into the folder you
# mount at /weights. Layout matches scripts/build_weights_bundle.sh output.
weights:
  root: "/weights"
  hpl_checkpoint: "/weights/hpl/BarlowTwins_3.ckt"
  hpl_model_name: "BarlowTwins_3"
  hpl_artifact_reference_h5: "/weights/hpl/reference/hdf5_colon_reference_he_complete.h5"
  hpl_reference_h5: "/weights/hpl/reference/hdf5_colon_reference_he_complete_filtered.h5"
  hpl_folds_pickle: "/weights/hpl/reference/colon_reference_folds.pkl"
  survclam_runs_root: "/weights/survclam/runs"

# ---- Step parameters (identical to config/pipeline.yaml; model-specific) ----
# These match the exact tiling used to train the shipped encoder/checkpoints
# (0b_tileLoop_deepzoom6.py -M -1 -P 0.504 -D 15 -p -1 -N '57,22,-8,20,10,5').
tile:
  tile_size: 224
  overlap: 0
  background_threshold: 50
  workers: 8
  mag: -1
  pixel_size: 0.504
  deviation: 15
  pixelsize_range: -1
  normalize: "57,22,-8,20,10,5"

project:
  rep_key: "img_z_latent"
  tiles_key: "tiles"
  z_dim: 128
  img_size: 224
  batch_size: 64

cluster:
  rep_key: "img_z_latent"
  artifact_meta_field: "cohort"
  artifact_resolution: 5.0
  artifact_fold: 1
  artifact_cluster_ids: [26, 34, 46, 47, 53, 62, 64, 77, 88, 92, 93, 95]
  hpc_meta_field: "cohort_cleaned"
  hpc_resolution: 2.5
  hpc_fold: 1

build_pt:
  model_key: "HPL_PANCOLON_20x"
  meta_field: "slides"
  embed_dim: 128

infer:
  runs_root_dataset: "colon_united"
  exp_code: "HPL_PANCOLON_20x__dfs__lr2e4_reg1e5_do025_clip1_plateau_p4_big"
  seed: 1
  task_type: "survival"
  # CLAM attention size of the shipped checkpoints (exp_code ends in _big ->
  # attention hidden dim 384). eval.py defaults to 'small' (256), so set it here.
  model_size: "big"
  time_col: "dfs_event_data"
  event_col: "dfs_event_ind"
  covariate_cols: ""
  cov_fusion: "concat"
  bag_level: "patient"
  pt_id_col: "slide_id"
  k: 16
  chips_folds: "all"
  # Fixed low/intermediate/high cutpoints: q33/q67 of the standardized 16-fold
  # CHiPS ensemble score on the colon_united development cohort (shipped
  # _p4_big model) — see pancolon/chips.py docstring for detail/regeneration.
  chips_tertile_thresholds: [-0.411285, 0.369834]

attention:
  which_sets: "test"
  overlay_dpi: 150

# ---- Results bundle for the static viewer (step `export`) ------------------
export:
  bundle_dir: "/out/bundle"
  hpc_atlas: "viewer/hpc_atlas.csv"   # relative to repo_root (/opt/pancolon)
